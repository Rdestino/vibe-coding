<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work & Break Timer</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            transition: background-color 0.5s ease;
        }

        /* Work background */
        body.work-mode {
            background-color: #dff5e1;
        }

        /* Break background */
        body.break-mode {
            background-color: #eadcff;
        }

        .timer-container {
            text-align: center;
        }

        #mode {
            font-size: clamp(36px, 6vw, 65px);
            font-weight: bold;
            margin-bottom: 20px;
        }

        #timer {
            font-size: clamp(90px, 20vw, 220px);
            font-weight: bold;
            margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            font-size: 24px;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        /* GREEN */
        #start {
            background-color: #2e7d32;
            color: white;
        }

        /* PURPLE */
        #pause {
            background-color: #7b2cbf;
            color: white;
        }

        /* PINK */
        #reset {
            background-color: #e75480;
            color: white;
        }

        /* MUTE BUTTON */
        #mute {
            background-color: #9c6ade;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body class="work-mode">

    <div class="timer-container">

        <div id="mode">WORK TIME</div>

        <div id="timer">25:00</div>

        <div class="buttons">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
            <button id="mute">🔊 Sound On</button>
        </div>

    </div>

    <script>
        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;

        let currentMode = "work";
        let timeLeft = WORK_TIME;
        let timerInterval = null;
        let isMuted = false;

        const timerDisplay = document.getElementById("timer");
        const modeDisplay = document.getElementById("mode");

        const startButton = document.getElementById("start");
        const pauseButton = document.getElementById("pause");
        const resetButton = document.getElementById("reset");
        const muteButton = document.getElementById("mute");

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            timerDisplay.textContent =
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0");
        }

        function updateModeDisplay() {

            if (currentMode === "work") {
                modeDisplay.textContent = "WORK TIME";
                document.body.className = "work-mode";
            } else {
                modeDisplay.textContent = "BREAK TIME";
                document.body.className = "break-mode";
            }
        }

        /* Play a gentle chime */
        function playChime() {

            if (isMuted) {
                return;
            }

            const audioContext =
                new (window.AudioContext || window.webkitAudioContext)();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 650;
            oscillator.type = "sine";

            gainNode.gain.setValueAtTime(
                0.3,
                audioContext.currentTime
            );

            gainNode.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 1
            );

            oscillator.start();
            oscillator.stop(audioContext.currentTime + 1);
        }

        function switchMode() {

            playChime();

            if (currentMode === "work") {
                currentMode = "break";
                timeLeft = BREAK_TIME;
            } else {
                currentMode = "work";
                timeLeft = WORK_TIME;
            }

            updateModeDisplay();
            updateDisplay();
        }

        function startTimer() {

            if (timerInterval !== null) {
                return;
            }

            timerInterval = setInterval(function () {

                if (timeLeft > 0) {
                    timeLeft--;
                }

                if (timeLeft === 0) {
                    switchMode();
                }

                updateDisplay();

            }, 1000);
        }

        function pauseTimer() {

            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {

            clearInterval(timerInterval);
            timerInterval = null;

            currentMode = "work";
            timeLeft = WORK_TIME;

            updateModeDisplay();
            updateDisplay();
        }

        function toggleMute() {

            isMuted = !isMuted;

            if (isMuted) {
                muteButton.textContent = "🔇 Muted";
            } else {
                muteButton.textContent = "🔊 Sound On";
            }
        }

        startButton.addEventListener("click", startTimer);
        pauseButton.addEventListener("click", pauseTimer);
        resetButton.addEventListener("click", resetTimer);
        muteButton.addEventListener("click", toggleMute);

        updateModeDisplay();
        updateDisplay();
    </script>

</body>
</html>
