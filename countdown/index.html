<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>It's TIME - Go Team4Moms</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            color: white;

            background:
                radial-gradient(circle at 20% 20%,
                    rgba(255,255,255,.8) 0 2px,
                    transparent 3px),

                radial-gradient(circle at 80% 30%,
                    rgba(255,215,0,.8) 0 2px,
                    transparent 3px),

                radial-gradient(circle at 40% 70%,
                    rgba(255,255,255,.7) 0 2px,
                    transparent 3px),

                linear-gradient(
                    to bottom,
                    #061a0d,
                    #0b3d1d,
                    #062912
                );

            background-size:
                90px 90px,
                120px 120px,
                150px 150px,
                100% 100%;

            animation: glitterMove 8s linear infinite;
        }


        @keyframes glitterMove {

            from {
                background-position:
                    0 0,
                    0 0,
                    0 0,
                    center;
            }

            to {
                background-position:
                    90px 180px,
                    -120px 240px,
                    150px 300px,
                    center;
            }
        }


        /* CHRISTMAS TREE */

        .tree {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1.3);

            opacity: .28;

            z-index: 0;

            filter:
                drop-shadow(0 0 20px #00ff66)
                drop-shadow(0 0 40px #008833);
        }


        .star {
            text-align: center;
            font-size: 85px;

            animation: starGlow 1.5s infinite alternate;
        }


        @keyframes starGlow {

            from {
                filter:
                    drop-shadow(0 0 5px gold);
            }

            to {
                filter:
                    drop-shadow(0 0 25px gold);
            }
        }


        .tree-part {

            width: 0;
            height: 0;

            margin: -35px auto 0;

            border-left: 180px solid transparent;
            border-right: 180px solid transparent;

            border-bottom: 230px solid #0ca34a;

            filter:
                drop-shadow(0 0 15px #16ff72);
        }


        .tree-part.middle {

            border-left-width: 230px;
            border-right-width: 230px;
            border-bottom-width: 280px;

            margin-top: -130px;
        }


        .tree-part.bottom {

            border-left-width: 290px;
            border-right-width: 290px;
            border-bottom-width: 340px;

            margin-top: -160px;
        }


        /* GLITTER */

        .sparkle {

            position: fixed;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: white;

            pointer-events: none;

            z-index: 1;

            animation:
                sparkleAnimation 2s infinite ease-in-out;
        }


        @keyframes sparkleAnimation {

            0% {
                opacity: .15;
                transform: scale(.4);
            }

            50% {
                opacity: 1;
                transform: scale(1.8);
                box-shadow:
                    0 0 12px white,
                    0 0 22px gold;
            }

            100% {
                opacity: .15;
                transform: scale(.4);
            }
        }


        /* COUNTDOWN AREA */

        .countdown-container {

            position: relative;

            z-index: 10;

            text-align: center;

            width: 95%;

            max-width: 1300px;

            padding: 40px;

            border-radius: 30px;

            background:
                rgba(0, 20, 10, .60);

            border:
                2px solid rgba(255,255,255,.35);

            box-shadow:
                0 0 30px rgba(255,255,255,.20),
                0 0 70px rgba(0,255,80,.20);

            backdrop-filter:
                blur(5px);
        }


        h1 {

            margin-top: 0;

            margin-bottom: 15px;

            font-size:
                clamp(42px, 7vw, 90px);

            color: white;

            text-shadow:
                0 0 10px red,
                0 0 20px green,
                0 0 30px gold;
        }


        .subtitle {

            font-size:
                clamp(20px, 3vw, 36px);

            margin-bottom: 45px;

            color: #fff4c2;
        }


        .countdown {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 16px;

            flex-wrap: wrap;
        }


        .time-box {

            min-width: 180px;

            padding: 25px 20px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.10);

            border:
                2px solid rgba(255,255,255,.3);

            box-shadow:
                0 0 20px rgba(255,255,255,.15);
        }


        .number {

            display: block;

            font-size:
                clamp(65px, 10vw, 140px);

            line-height: 1;

            font-weight: 900;

            font-variant-numeric:
                tabular-nums;

            transition:
                color .4s ease;

            text-shadow:
                0 0 10px currentColor,
                0 0 25px currentColor;
        }


        /*
           Numbers alternate:
           Days = Red
           Hours = Green
           Minutes = Red
           Seconds = Green
        */

        .red {
            color: #ff2e2e;
        }

        .green {
            color: #32e875;
        }


        .label {

            display: block;

            margin-top: 12px;

            font-size:
                clamp(18px, 2vw, 28px);

            font-weight: bold;

            letter-spacing: 2px;

            color: white;
        }


        .message {

            margin-top: 35px;

            font-size:
                clamp(20px, 3vw, 38px);

            color: #ffd700;

            font-weight: bold;

            text-shadow:
                0 0 10px #ff0000;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .countdown-container {
                padding: 25px 12px;
            }

            .time-box {
                min-width: 135px;
                padding: 20px 12px;
            }

            .tree {
                transform:
                    translate(-50%, -50%)
                    scale(.7);
            }
        }

    </style>

</head>


<body>


    <!-- Decorative Christmas Tree -->

    <div class="tree">

        <div class="star">
            ⭐
        </div>

        <div class="tree-part"></div>

        <div class="tree-part middle"></div>

        <div class="tree-part bottom"></div>

    </div>



    <!-- Countdown -->

    <div class="countdown-container">

        <h1>
            🎄 Countdown to Christmas 🎄
        </h1>

        <div class="subtitle">
            Christmas Day • December 25, 2026
        </div>


        <div class="countdown">


            <div class="time-box">

                <span
                    id="days"
                    class="number red">

                    00

                </span>

                <span class="label">
                    DAYS
                </span>

            </div>



            <div class="time-box">

                <span
                    id="hours"
                    class="number green">

                    00

                </span>

                <span class="label">
                    HOURS
                </span>

            </div>



            <div class="time-box">

                <span
                    id="minutes"
                    class="number red">

                    00

                </span>

                <span class="label">
                    MINUTES
                </span>

            </div>



            <div class="time-box">

                <span
                    id="seconds"
                    class="number green">

                    00

                </span>

                <span class="label">
                    SECONDS
                </span>

            </div>


        </div>


        <div
            id="message"
            class="message">

            ✨ Until Christmas Morning! ✨

        </div>


    </div>



    <script>

        /*
        ==============================================
        CHRISTMAS DATE
        ==============================================

        Christmas 2026
        December 25, 2026
        12:00 AM Eastern Standard Time

        -05:00 specifically represents EST.

        This means the Christmas date lives directly
        inside this program and does NOT reset when
        the browser closes.
        */

        const christmasDate =
            new Date("2026-12-25T00:00:00-05:00");


        const daysDisplay =
            document.getElementById("days");

        const hoursDisplay =
            document.getElementById("hours");

        const minutesDisplay =
            document.getElementById("minutes");

        const secondsDisplay =
            document.getElementById("seconds");

        const messageDisplay =
            document.getElementById("message");



        function updateCountdown() {

            /*
            Get the REAL current date and time
            from the computer.
            */

            const now = new Date();


            /*
            Calculate the difference between
            now and Christmas.
            */

            const distance =
                christmasDate.getTime()
                -
                now.getTime();


            /*
            Christmas has arrived.
            */

            if (distance <= 0) {

                daysDisplay.textContent = "00";
                hoursDisplay.textContent = "00";
                minutesDisplay.textContent = "00";
                secondsDisplay.textContent = "00";

                messageDisplay.innerHTML =
                    "🎅🎄 MERRY CHRISTMAS! 🎄🎅";

                return;
            }


            /*
            Convert milliseconds into
            days, hours, minutes and seconds.
            */

            const days =
                Math.floor(
                    distance /
                    (1000 * 60 * 60 * 24)
                );


            const hours =
                Math.floor(
                    (
                        distance %
                        (1000 * 60 * 60 * 24)
                    )
                    /
                    (1000 * 60 * 60)
                );


            const minutes =
                Math.floor(
                    (
                        distance %
                        (1000 * 60 * 60)
                    )
                    /
                    (1000 * 60)
                );


            const seconds =
                Math.floor(
                    (
                        distance %
                        (1000 * 60)
                    )
                    /
                    1000
                );


            /*
            Put the numbers onto the screen.
            */

            daysDisplay.textContent =
                String(days).padStart(2, "0");

            hoursDisplay.textContent =
                String(hours).padStart(2, "0");

            minutesDisplay.textContent =
                String(minutes).padStart(2, "0");

            secondsDisplay.textContent =
                String(seconds).padStart(2, "0");

        }



        /*
        ==============================================
        CREATE GLITTER
        ==============================================
        */

        function createSparkles() {

            for (let i = 0; i < 80; i++) {

                const sparkle =
                    document.createElement("div");

                sparkle.classList.add("sparkle");


                sparkle.style.left =
                    Math.random() * 100 + "vw";


                sparkle.style.top =
                    Math.random() * 100 + "vh";


                sparkle.style.animationDelay =
                    Math.random() * 3 + "s";


                sparkle.style.animationDuration =
                    (
                        1.5 +
                        Math.random() * 2
                    )
                    + "s";


                const size =
                    3 +
                    Math.random() * 7;


                sparkle.style.width =
                    size + "px";


                sparkle.style.height =
                    size + "px";


                document.body.appendChild(
                    sparkle
                );

            }

        }



        /*
        Create the glitter when the page opens.
        */

        createSparkles();



        /*
        Run immediately so there is no delay
        when the page opens.
        */

        updateCountdown();



        /*
        Update the countdown automatically
        every second.
        */

        setInterval(
            updateCountdown,
            1000
        );

    </script>


</body>

</html>
