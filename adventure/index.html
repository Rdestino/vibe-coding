<!DOCTYPE html>
<!--
  VERSION HISTORY
  v1.0 - initial build: visual novel look (character portrait over a background,
         name plate above the words, dialogue box), story kept in one list at the
         top of the script, Play again button on every ending.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page paint under phone status bars; the CSS below keeps the text clear of them -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Princess and the Rainbow Castle</title>

<style>
  /* v1.0 - initial build of the styles */

  /* ------------------------------------------------------------------
     COLOR TOKENS
     All the interface colors live here as named variables. The first block
     is the light theme. The two blocks after it swap in darker colors when the
     person's device is set to dark mode (or when data-theme="dark" is set).
     The scene backgrounds themselves are chosen in the script, not here.
     ------------------------------------------------------------------ */
  :root {
    --page: #2b1747;          /* color behind everything, seen only if the scene fails to load */
    --paper: #fff8fd;         /* dialogue box fill */
    --ink: #2b1747;           /* main text color */
    --ink-soft: #5a4478;      /* quieter text color (scene name, tip line) */
    --edge: #4a2a86;          /* dialogue box border and choice outlines */
    --chip: rgba(255, 255, 255, 0.86); /* soft panels on top of the scenery */
    --choice: #f1e6ff;        /* choice button fill */
    --choice-hover: #e3d0ff;  /* choice button fill when hovered */
    --accent: #b8287f;        /* Next and Play again buttons (white text on this passes contrast) */
    --accent-hover: #961f67;
    --focus: #1a5fe0;         /* keyboard focus ring */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #120a24;
      --paper: #2a1848;
      --ink: #fff1fb;
      --ink-soft: #d8c6f2;
      --edge: #d9b8ff;
      --chip: rgba(30, 16, 56, 0.86);
      --choice: #3d2866;
      --choice-hover: #4d3380;
      --accent: #b8287f;
      --accent-hover: #d03a96;
      --focus: #9cc2ff;
    }
  }
  :root[data-theme="dark"] {
    --page: #120a24;
    --paper: #2a1848;
    --ink: #fff1fb;
    --ink-soft: #d8c6f2;
    --edge: #d9b8ff;
    --chip: rgba(30, 16, 56, 0.86);
    --choice: #3d2866;
    --choice-hover: #4d3380;
    --accent: #b8287f;
    --accent-hover: #d03a96;
    --focus: #9cc2ff;
  }

  /* ------------------------------------------------------------------
     PAGE BASICS
     Make the page fill the whole screen and use a friendly rounded system
     font (no fonts are downloaded, so nothing is requested from the internet).
     ------------------------------------------------------------------ */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold",
                 "Trebuchet MS", system-ui, sans-serif;
    line-height: 1.5;
  }

  /* A clear ring around whatever the keyboard is pointing at */
  :focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  /* ------------------------------------------------------------------
     THE STAGE
     The stage is a three-row grid: top bar, character area (stretches to
     fill the space), dialogue box. The scenery sits behind all of it.
     ------------------------------------------------------------------ */
  .stage {
    position: relative;
    min-height: 100%;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }

  /* The scenery layer. The script paints a different background in here for each scene. */
  .backdrop {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  /* ------------------------------------------------------------------
     TOP BAR: game title, current scene name, and the Start over button
     ------------------------------------------------------------------ */
  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    padding: calc(0.75rem + env(safe-area-inset-top, 0px)) 1rem 0;
  }
  .title-block {
    background: var(--chip);
    border-radius: 1rem;
    padding: 0.5rem 0.9rem;
    min-width: 0;
  }
  .title-block h1 {
    margin: 0;
    font-size: clamp(1rem, 2.8vw, 1.35rem);
    line-height: 1.25;
  }
  .scene-name {
    margin: 0;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  .ghost-btn {
    flex: none;
    min-height: 2.75rem;
    padding: 0.4rem 1rem;
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    background: var(--chip);
    border: 2px solid var(--edge);
    border-radius: 999px;
    cursor: pointer;
  }
  .ghost-btn:hover { background: var(--choice-hover); }

  /* ------------------------------------------------------------------
     CHARACTER PORTRAIT: the big character standing in the scene
     ------------------------------------------------------------------ */
  .portrait {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: end center;
    padding: 0.5rem 1rem 0.75rem;
    min-height: 0;
  }
  .sprite {
    display: block;
    font-size: clamp(5.5rem, 26vmin, 13rem);
    line-height: 1;
    text-align: center;
    filter: drop-shadow(0 6px 10px rgba(40, 10, 80, 0.35));
  }
  /* A soft oval on the ground so the character looks like they are standing there */
  .sprite-shadow {
    display: block;
    width: 55%;
    height: 0.9rem;
    margin: -0.35rem auto 0;
    border-radius: 50%;
    background: rgba(40, 10, 80, 0.28);
    filter: blur(4px);
  }
  /* When the story calls a scene "grey", the character loses their color too */
  .stage[data-mood="grey"] .sprite { filter: grayscale(1) drop-shadow(0 6px 10px rgba(40, 10, 80, 0.3)); }

  /* A quick pop-in when a different character starts talking */
  @keyframes pop-in {
    from { transform: translateY(14px) scale(0.92); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .sprite.pop { animation: pop-in 260ms ease-out; }

  /* ------------------------------------------------------------------
     DIALOGUE BOX: name plate on top, words inside, buttons at the bottom
     ------------------------------------------------------------------ */
  .dialogue {
    position: relative;
    z-index: 2;
    justify-self: center;
    width: min(100% - 2rem, 52rem);
    margin-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    padding: 1.9rem 1.25rem 1.1rem;
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--edge);
    border-radius: 1.5rem;
    box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.35), 0 14px 32px rgba(40, 10, 80, 0.35);
  }
  /* The name plate pokes up over the top-left edge of the box, like in a visual novel */
  .nameplate {
    position: absolute;
    left: 1.25rem;
    top: 0;
    transform: translateY(-55%);
    margin: 0;
    padding: 0.3rem 1rem;
    max-width: calc(100% - 2.5rem);
    font-size: 1.05rem;
    font-weight: 800;
    color: #ffffff;
    background: #3b2a63;      /* the script swaps this to each character's color */
    border: 3px solid var(--paper);
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(40, 10, 80, 0.3);
  }
  .words {
    margin: 0;
    min-height: 3.2rem;
    font-size: clamp(1.15rem, 2.6vw, 1.4rem);
    line-height: 1.55;
    font-weight: 600;
  }

  /* Area under the words that holds the Next button, the choices, or the ending buttons */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 0.9rem;
  }
  .controls[data-mode="next"] { align-items: flex-end; }

  .next-btn, .again-btn {
    min-height: 3rem;
    padding: 0.55rem 1.6rem;
    font: inherit;
    font-weight: 800;
    font-size: 1.1rem;
    color: #ffffff;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
  }
  .next-btn:hover, .again-btn:hover { background: var(--accent-hover); }
  .again-btn { align-self: center; margin-top: 0.4rem; }

  /* Choice buttons: wide, easy to tap, with a small number badge for keyboard users */
  .choice {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    min-height: 3.25rem;
    padding: 0.65rem 1rem;
    font: inherit;
    font-weight: 700;
    font-size: 1.1rem;
    text-align: left;
    color: var(--ink);
    background: var(--choice);
    border: 2px solid var(--edge);
    border-radius: 1rem;
    cursor: pointer;
  }
  .choice:hover { background: var(--choice-hover); }
  .choice .key {
    flex: none;
    display: grid;
    place-items: center;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 50%;
    font-size: 0.95rem;
    color: var(--paper);
    background: var(--edge);
  }

  /* The label shown at an ending, such as "Happy ending" */
  .ending-label {
    margin: 0;
    text-align: center;
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--accent);
  }
  :root[data-theme="dark"] .ending-label { color: #ff9ad2; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ending-label { color: #ff9ad2; }
  }

  /* Keyboard tip. Hidden on touch screens where it would not apply. */
  .tip {
    margin: 0.75rem 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  @media (hover: none) { .tip { display: none; } }

  /* ------------------------------------------------------------------
     SMALL SCREENS: tighten the spacing so the box does not eat the character
     ------------------------------------------------------------------ */
  @media (max-width: 480px) {
    .dialogue { padding: 1.8rem 1rem 1rem; }
    .topbar { padding-left: 0.75rem; padding-right: 0.75rem; }
  }

  /* People who asked their device for less motion get no pop-in animation */
  @media (prefers-reduced-motion: reduce) {
    .sprite.pop { animation: none; }
  }
</style>
</head>

<body>

<!-- If JavaScript is turned off the game cannot run, so say so plainly -->
<noscript>This story game needs JavaScript turned on to play.</noscript>

<!-- The whole game lives inside this one main area -->
<main class="stage" id="stage" aria-labelledby="game-title">

  <!-- Scenery layer (decorative, so screen readers skip it) -->
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <!-- Top bar: title, current scene, and a button to start over -->
  <header class="topbar">
    <div class="title-block">
      <h1 id="game-title">The Princess and the Rainbow Castle 🌈</h1>
      <p class="scene-name" id="scene-name"></p>
    </div>
    <button type="button" class="ghost-btn" id="restart-btn">Start over</button>
  </header>

  <!-- Character portrait (decorative: the speaker's name is read out in the dialogue box instead) -->
  <div class="portrait" aria-hidden="true">
    <div>
      <span class="sprite" id="sprite"></span>
      <span class="sprite-shadow"></span>
    </div>
  </div>

  <!-- Dialogue box -->
  <section class="dialogue" aria-label="Story">
    <!-- This live area is read aloud by screen readers each time the words change -->
    <div id="speech" aria-live="polite" aria-atomic="true">
      <p class="nameplate" id="speaker"></p>
      <p class="words" id="words"></p>
    </div>
    <!-- Next button, choice buttons, or ending buttons get placed here by the script -->
    <div class="controls" id="controls"></div>
    <p class="tip">Tip: press Enter to continue, or press a number key to pick a choice.</p>
  </section>

</main>

<script>
/* =====================================================================
   v1.0 - initial build

   HOW THIS FILE IS ORGANIZED
   1. STORY       - the whole story in one list (EDIT THIS to change the story)
   2. LOOK        - characters and backgrounds (who the speakers are, how scenes look)
   3. GAME ENGINE - the code that plays the story. You should not need to touch it.
   ===================================================================== */


/* =====================================================================
   1. THE STORY
   ---------------------------------------------------------------------
   Every scene is one block in this list. A scene has:
     id         - a short unique name. Choices point to scenes using this name.
     title      - the scene name shown at the top of the screen.
     background - which scenery to show (names are listed in BACKGROUNDS below).
     focus      - which character is shown while the Storyteller talks.
     mood       - optional. Use "grey" to drain the color from the character.
     lines      - the words, shown one at a time. "who" says who is speaking
                  (storyteller, princess, bubbles, ella, grumble).
     choices    - the buttons shown after the last line. "label" is the
                  button text and "goTo" is the id of the scene it leads to.
     ending     - optional. Add text like "Happy ending" to make the scene an
                  ending. Every ending gets a Play again button automatically.
   To add a scene, copy a block, give it a new id, and point a choice at it.
   ===================================================================== */
const STORY = [
  {
    id: "wake",
    title: "The Princess Wakes Up",
    background: "bedroom",
    focus: "princess",
    lines: [
      { who: "storyteller", text: "Once upon a time, a little princess woke up in her cozy bed. She stretched, yawned, and looked out her window." },
      { who: "storyteller", text: "OH MY! Her beautiful pink and purple castle had changed colors overnight!" }
    ],
    choices: [
      { label: "Look out the window", goTo: "rainbow" },
      { label: "Run outside to investigate", goTo: "garden" }
    ]
  },

  {
    id: "rainbow",
    title: "The Rainbow Surprise",
    background: "rainbow",
    focus: "princess",
    lines: [
      { who: "storyteller", text: "The princess gasped." },
      { who: "princess", text: "OH MY RAINBOWS! My castle is BEAUTIFUL!" },
      { who: "storyteller", text: "Suddenly, the rainbow colors began to flicker." },
      { who: "storyteller", text: "The princess shouted her magic words:" },
      { who: "princess", text: "Sparkle bright, colors glow, make my rainbow castle grow!" }
    ],
    choices: [
      { label: "The rainbow glows", goTo: "unicorn" },
      { label: "The rainbow turns grey, black, and white", goTo: "cloud" }
    ]
  },

  {
    id: "garden",
    title: "The Magical Garden",
    background: "garden",
    focus: "bubbles",
    lines: [
      { who: "storyteller", text: "The princess met Bubbles the Bunny, who had a very tickly nose." },
      { who: "bubbles", text: "AHH… AHHH… ACHOOOO!" },
      { who: "storyteller", text: "Bubbles sneezed a giant cloud of GLITTER all over the princess!" },
      { who: "storyteller", text: "The princess giggled." },
      { who: "princess", text: "Oh, Bubbles! Now even my slippers are sparkling!" },
      { who: "storyteller", text: "Can you make the biggest, silliest bunny sneeze?" }
    ],
    choices: [
      { label: "Keep exploring", goTo: "unicorn" }
    ]
  },

  {
    id: "unicorn",
    title: "The Rainbow Unicorn",
    background: "meadow",
    focus: "ella",
    lines: [
      { who: "storyteller", text: "Ella the Unicorn appeared in a flash of pink and purple light." },
      { who: "ella", text: "HIC!" },
      { who: "storyteller", text: "A tiny rainbow popped out of her mouth." },
      { who: "ella", text: "HIC! HIC!" },
      { who: "storyteller", text: "Two more rainbows flew into the sky!" },
      { who: "ella", text: "Oh, pickle pancakes! I've got the rainbow hiccups AGAIN!" },
      { who: "storyteller", text: "Can you make a funny unicorn hiccup?" }
    ],
    choices: [
      { label: "Ella the Unicorn was able to stop immediately", goTo: "tower" },
      { label: "Ella the Unicorn kept hiccupping", goTo: "cloud" }
    ]
  },

  {
    id: "tower",
    title: "The Secret Tower",
    background: "tower",
    focus: "princess",
    lines: [
      { who: "storyteller", text: "The princess discovered two keys: one sparkled with rainbow colors, and the other was dull and grey." },
      { who: "storyteller", text: "Pretend you are holding a magical key! Turn it slowly. Now say the magic words with the princess!" },
      { who: "princess", text: "Sparkle bright, colors glow, make my rainbow castle grow!" }
    ],
    choices: [
      { label: "Go find Grumble the Cloud", goTo: "cloud" }
    ]
  },

  {
    id: "cloud",
    title: "The Grumpy Cloud",
    background: "storm",
    focus: "grumble",
    lines: [
      { who: "storyteller", text: "Grumble the Cloud looked down at his grey, gloomy body." },
      { who: "grumble", text: "Everyone else gets pretty colors. I'm just a boring old rain cloud." },
      { who: "storyteller", text: "The princess thought for a moment." },
      { who: "princess", text: "If you could give Grumble ANY magical color, what color would you choose?" }
    ],
    choices: [
      { label: "Give Grumble a rainbow of colors", goTo: "forever" },
      { label: "Let Grumble choose the dusty key", goTo: "colorless" }
    ]
  },

  {
    id: "forever",
    title: "The Rainbow Forever",
    background: "sparkle",
    focus: "princess",
    lines: [
      { who: "storyteller", text: "The princess raised her magical key and made her biggest wish." },
      { who: "princess", text: "Close your eyes, make a magical wish, and say the magic words one last time!" },
      { who: "princess", text: "Sparkle bright, colors glow, make my rainbow castle grow!" },
      { who: "storyteller", text: "WHOOSH! The castle exploded with beautiful rainbow sparkles!" }
    ],
    choices: [
      { label: "Everyone danced at the biggest rainbow party EVER!", goTo: "party" },
      { label: "Everyone jumped in the pool and swam", goTo: "pool" }
    ]
  },

  {
    id: "party",
    title: "The Rainbow Party",
    background: "party",
    focus: "princess",
    ending: "Happy ending",
    lines: [
      { who: "storyteller", text: "Everyone danced at the biggest rainbow party EVER!" }
    ],
    choices: []
  },

  {
    id: "pool",
    title: "The Pool Party",
    background: "pool",
    focus: "princess",
    ending: "Happy ending",
    lines: [
      { who: "storyteller", text: "Everyone jumped in the pool and swam." }
    ],
    choices: []
  },

  {
    id: "colorless",
    title: "The Colorless Castle",
    background: "colorless",
    focus: "princess",
    mood: "grey",
    ending: "Not-so-happy ending",
    lines: [
      { who: "storyteller", text: "The princess watched as the Cloud chose the dusty key and the rainbow colors disappeared." },
      { who: "princess", text: "Oh, rainbow pickles!" },
      { who: "storyteller", text: "But the princess wasn't ready to give up!" },
      { who: "storyteller", text: "Should we try our magic words again, or go back to the beginning and make different choices?" }
    ],
    choices: [
      { label: "Try the magic words again", goTo: "forever" }
    ]
  }
];

// The id of the scene the game begins on (and returns to on Play again).
const START_SCENE_ID = "wake";


/* =====================================================================
   2. THE LOOK: characters and backgrounds (visual novel style)
   ---------------------------------------------------------------------
   CHARACTERS says who can speak: the name on the name plate, the portrait
   (an emoji), and the name plate color.
   BACKGROUNDS says how each scene's scenery looks. Each one is a stack of
   CSS gradients: a sky, a ground, and sometimes a rainbow, stars, or confetti.
   ===================================================================== */
const CHARACTERS = {
  storyteller: { name: "Storyteller",        emoji: "📖",  color: "#3b2a63" },
  princess:    { name: "Princess",           emoji: "👸",  color: "#b8287f" },
  bubbles:     { name: "Bubbles the Bunny",  emoji: "🐰",  color: "#2a7a89" },
  ella:        { name: "Ella the Unicorn",   emoji: "🦄",  color: "#7a4fd6" },
  grumble:     { name: "Grumble the Cloud",  emoji: "🌧️", color: "#59627a" }
};

/* Small helpers that build the gradient layers. */
// Sky: a gradient from the top of the screen down to the horizon (62% of the way down).
const SKY = (top, bottom) =>
  "linear-gradient(180deg, " + top + " 0%, " + bottom + " 62%)";
// Ground: a solid band from the horizon to the bottom, with a transparent top so the sky shows through.
const GROUND = (top, bottom) =>
  "linear-gradient(180deg, transparent 62%, " + top + " 62%, " + bottom + " 100%)";
// A six-color rainbow arc rising from the horizon.
const RAINBOW =
  "radial-gradient(circle 62vmin at 50% 62%, transparent 0 60%, " +
  "#ff5d7d 60% 66%, #ffa94d 66% 72%, #ffe14d 72% 78%, " +
  "#6fdc7a 78% 84%, #55b9ff 84% 90%, #9b7bff 90% 96%, transparent 96%)";
// Little round dots, used for stars, sparkles, and confetti. Each call makes one dot.
const DOT = (x, y, color, size) =>
  "radial-gradient(circle at " + x + " " + y + ", " + color + " 0 " + size + ", transparent calc(" + size + " + 1px))";

const BACKGROUNDS = {
  bedroom:   [GROUND("#b983dc", "#9a63c4"), SKY("#ffd9ee", "#e6c6fa")].join(", "),
  rainbow:   [GROUND("#8fdc8a", "#4fb866"), RAINBOW, SKY("#bfe9ff", "#f4fbff")].join(", "),
  garden:    [GROUND("#8fdc8a", "#4fb866"), SKY("#c9f1ff", "#eafbdc")].join(", "),
  meadow:    [GROUND("#8fdc9f", "#4fb87a"), SKY("#ffd0f1", "#d7ccff")].join(", "),
  tower:     [GROUND("#3a2a6d", "#241848"),
              DOT("12%", "18%", "#ffffff", "2px"), DOT("80%", "12%", "#ffffff", "2px"),
              DOT("65%", "38%", "#ffffff", "2px"), DOT("28%", "34%", "#ffffff", "2px"),
              SKY("#2b1e5c", "#5b3f9e")].join(", "),
  storm:     [GROUND("#7c8596", "#5a6275"), SKY("#8d96aa", "#c5cad6")].join(", "),
  sparkle:   [GROUND("#8fe09a", "#4fc16c"),
              DOT("14%", "20%", "#ffc400", "4px"), DOT("84%", "16%", "#ffc400", "4px"),
              DOT("72%", "40%", "#ffc400", "3px"), DOT("26%", "36%", "#ffc400", "3px"),
              RAINBOW, SKY("#ffe0f6", "#fff6d9")].join(", "),
  party:     [GROUND("#8fe09a", "#4fc16c"),
              DOT("10%", "16%", "#ff5d7d", "6px"), DOT("30%", "10%", "#55b9ff", "6px"),
              DOT("52%", "20%", "#ffe14d", "6px"), DOT("74%", "8%", "#6fdc7a", "6px"),
              DOT("90%", "24%", "#9b7bff", "6px"), DOT("18%", "42%", "#ffa94d", "5px"),
              DOT("84%", "46%", "#ff5d7d", "5px"),
              RAINBOW, SKY("#ffe0f6", "#fff6d9")].join(", "),
  pool:      [GROUND("#4cc3ff", "#1f8fe0"), SKY("#bfeaff", "#e8f8ff")].join(", "),
  colorless: [GROUND("#a9a9b3", "#7d7d89"), SKY("#d4d4da", "#ececf0")].join(", ")
};


/* =====================================================================
   3. THE GAME ENGINE
   Everything below runs the story. If you only want to change the story
   or the look, you can stop reading here.
   ===================================================================== */

/* ---- Grab the pieces of the page we will be updating ------------------ */
const stageEl     = document.getElementById("stage");      // the whole game area
const backdropEl  = document.getElementById("backdrop");   // the scenery layer
const spriteEl    = document.getElementById("sprite");     // the big character portrait
const speakerEl   = document.getElementById("speaker");    // the name plate
const wordsEl     = document.getElementById("words");      // the line being spoken
const controlsEl  = document.getElementById("controls");   // holds Next / choices / Play again
const sceneNameEl = document.getElementById("scene-name"); // scene title in the top bar
const restartBtn  = document.getElementById("restart-btn");// "Start over" button

/* ---- Remember where the player is ------------------------------------ */
let currentScene = null; // the scene object being shown right now
let lineIndex = 0;       // which line of that scene is on screen (0 = first)

/* ---- Build a quick lookup so a scene can be found by its id ----------- */
// This turns the STORY list into a dictionary: scenesById["wake"] gives the "wake" scene.
const scenesById = {};
STORY.forEach(function (scene) { scenesById[scene.id] = scene; });

/* ---- Safety check for story editors ----------------------------------- */
// If a choice points to a scene id that does not exist, tell the editor in the
// browser console (press F12) instead of failing silently when someone clicks it.
STORY.forEach(function (scene) {
  (scene.choices || []).forEach(function (choice) {
    if (!scenesById[choice.goTo]) {
      console.warn('Scene "' + scene.id + '" has a choice pointing to a missing scene: "' + choice.goTo + '"');
    }
  });
});

/* ---- Show a whole new scene ------------------------------------------- */
// Resets to the scene's first line, swaps in the scenery, and updates the top bar.
function showScene(sceneId) {
  const scene = scenesById[sceneId];
  if (!scene) {
    console.error('Cannot find a scene with the id "' + sceneId + '".');
    return;
  }
  currentScene = scene;
  lineIndex = 0;

  // Paint this scene's scenery; fall back to the opening scene's look if the name is unknown.
  backdropEl.style.background = BACKGROUNDS[scene.background] || BACKGROUNDS[STORY[0].background];

  // Tell the stylesheet whether this scene is "grey" so the character can lose its color.
  stageEl.dataset.mood = scene.mood || "";

  // Show the scene title in the top bar.
  sceneNameEl.textContent = scene.title;

  showLine();
}

/* ---- Show the current line of the current scene ----------------------- */
// Puts the speaker's name and words in the dialogue box, picks the portrait,
// then shows either a Next button (more lines to come) or the choices (last line).
function showLine() {
  const line = currentScene.lines[lineIndex];

  // Who is talking? Unknown names fall back to the Storyteller so the game never breaks.
  const speaker = CHARACTERS[line.who] || CHARACTERS.storyteller;

  // Which portrait to show? A character who speaks appears themselves.
  // While the Storyteller talks, we keep showing the scene's "focus" character.
  const portraitCharacter = (line.who !== "storyteller" && CHARACTERS[line.who])
    ? CHARACTERS[line.who]
    : (CHARACTERS[currentScene.focus] || CHARACTERS.princess);

  // Update the name plate and the words.
  speakerEl.textContent = speaker.name;
  speakerEl.style.background = speaker.color;
  wordsEl.textContent = line.text;

  // Swap the portrait. Only play the pop-in animation when the character actually changes.
  if (spriteEl.textContent !== portraitCharacter.emoji) {
    spriteEl.textContent = portraitCharacter.emoji;
    spriteEl.classList.remove("pop");
    void spriteEl.offsetWidth;        // forces the browser to restart the animation
    spriteEl.classList.add("pop");
  }

  // More lines left? Show Next. On the last line, show the choices or the ending.
  const isLastLine = lineIndex === currentScene.lines.length - 1;
  if (isLastLine) {
    showChoicesOrEnding();
  } else {
    showNextButton();
  }
}

/* ---- The Next button -------------------------------------------------- */
// One Next button is created once and reused, so a screen reader is not told
// about a brand-new button after every single line.
const nextBtn = document.createElement("button");
nextBtn.type = "button";
nextBtn.className = "next-btn";
nextBtn.textContent = "Next";
nextBtn.setAttribute("aria-label", "Next line");

// Clicking Next moves to the following line of the scene.
nextBtn.addEventListener("click", function () {
  lineIndex += 1;
  showLine();
});

// Puts the Next button in the controls area and gives it keyboard focus,
// so the player can simply keep pressing Enter or Space to read on.
function showNextButton() {
  if (controlsEl.firstElementChild !== nextBtn || controlsEl.childElementCount !== 1) {
    controlsEl.replaceChildren(nextBtn);
  }
  controlsEl.dataset.mode = "next";
  nextBtn.focus({ preventScroll: true });
}

/* ---- Choices and endings ---------------------------------------------- */
// After the last line: show one button per choice. If the scene is an ending,
// also show the ending label and a Play again button.
function showChoicesOrEnding() {
  const parts = [];                 // everything we are about to put in the controls area
  let firstButton = null;           // the button that should receive keyboard focus

  // Endings get a label such as "Happy ending".
  if (currentScene.ending) {
    const label = document.createElement("p");
    label.className = "ending-label";
    label.textContent = currentScene.ending;
    parts.push(label);
  }

  // One button per choice, numbered 1, 2, 3... so number keys work too.
  const choices = currentScene.choices || [];
  if (choices.length > 0) {
    const group = document.createElement("div");
    group.className = "controls";
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", "Choices");

    choices.forEach(function (choice, i) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.setAttribute("aria-keyshortcuts", String(i + 1));

      // The number badge is decoration for sighted users; screen readers just read the label.
      const badge = document.createElement("span");
      badge.className = "key";
      badge.setAttribute("aria-hidden", "true");
      badge.textContent = String(i + 1);

      const text = document.createElement("span");
      text.textContent = choice.label;

      btn.append(badge, text);

      // Picking a choice moves the story to the scene it points to.
      btn.addEventListener("click", function () { showScene(choice.goTo); });

      group.appendChild(btn);
      if (!firstButton) firstButton = btn;
    });
    parts.push(group);
  }

  // Every ending gets a Play again button that goes back to the very beginning.
  if (currentScene.ending) {
    const again = document.createElement("button");
    again.type = "button";
    again.className = "again-btn";
    again.textContent = "Play again";
    again.addEventListener("click", restart);
    parts.push(again);
    if (!firstButton) firstButton = again;
  }

  controlsEl.dataset.mode = "choices";
  controlsEl.replaceChildren.apply(controlsEl, parts);

  // Move keyboard focus to the first button so the player can pick right away.
  if (firstButton) firstButton.focus({ preventScroll: true });
}

/* ---- Starting over ----------------------------------------------------- */
// Goes back to the opening scene. Used by Play again and the Start over button.
function restart() {
  showScene(START_SCENE_ID);
}
restartBtn.addEventListener("click", restart);

/* ---- Keyboard shortcuts ------------------------------------------------ */
// Pressing 1-9 clicks the matching numbered choice (if choices are on screen).
// Enter and Space already work on whichever button has focus.
document.addEventListener("keydown", function (event) {
  if (event.ctrlKey || event.metaKey || event.altKey) return;   // leave browser shortcuts alone
  if (!/^[1-9]$/.test(event.key)) return;                       // only number keys matter here
  const buttons = controlsEl.querySelectorAll(".choice");
  const picked = buttons[Number(event.key) - 1];
  if (picked) {
    event.preventDefault();
    picked.click();
  }
});

/* ---- Begin! ------------------------------------------------------------ */
showScene(START_SCENE_ID);
</script>
</body>
</html>
