
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Wizard - Accessible Word Guessing Game</title>

  <style>
    /* v2.0 - Accessible Word Wizard */

    :root {
      --green: #247a43;
      --yellow: #a97800;
      --gray: #626a73;
      --purple: #64349a;
      --background: #f7efff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: #24212b;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 550px;
      margin: 0 auto;
      padding: 16px 10px 35px;
      text-align: center;
    }

    h1 {
      color: var(--purple);
      margin: 10px 0;
      font-size: clamp(28px, 7vw, 40px);
    }

    .instructions {
      font-size: 16px;
      line-height: 1.5;
    }

    /* The six-row, five-column guessing board. */
    #board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: min(100%, 330px);
      margin: 20px auto;
    }

    .tile {
      aspect-ratio: 1;
      border: 2px solid #888;
      border-radius: 6px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 6vw, 30px);
      font-weight: bold;
    }

    .tile.filled {
      border-color: var(--purple);
    }

    .correct {
      background: var(--green) !important;
      border-color: var(--green) !important;
      color: white !important;
    }

    .present {
      background: var(--yellow) !important;
      border-color: var(--yellow) !important;
      color: white !important;
    }

    .absent {
      background: var(--gray) !important;
      border-color: var(--gray) !important;
      color: white !important;
    }

    #message {
      min-height: 45px;
      font-size: 17px;
      font-weight: bold;
      color: #4d267c;
    }

    /* Keyboard rows resize to fit narrow screens. */
    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 15px auto;
      max-width: 520px;
    }

    .key-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    .key {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      padding: 4px 1px;
      border: 1px solid #aaa;
      border-radius: 5px;
      background: #e1d8ed;
      color: #24212b;
      font-size: clamp(12px, 3vw, 16px);
      font-weight: bold;
      cursor: pointer;
    }

    .key.special {
      flex: 1.7;
      font-size: clamp(10px, 2.5vw, 13px);
    }

    button:focus-visible {
      outline: 3px solid #185abc;
      outline-offset: 3px;
    }

    #newGame {
      margin-top: 14px;
      padding: 13px 25px;
      background: var(--purple);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .legend {
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 380px) {
      .key-row {
        gap: 2px;
      }

      .key {
        min-height: 43px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>🪄 Word Wizard 🌈</h1>

    <p class="instructions" id="instructions">
      Guess the secret five-letter word in six tries.
      Use the keyboard below or type on your computer.
      Press Enter to submit and Backspace to erase.
    </p>

    <div
      id="board"
      role="group"
      aria-label="Word guessing board, six rows of five tiles"
      aria-describedby="instructions">
    </div>

    <p id="message" role="status" aria-live="polite" aria-atomic="true"></p>

    <div
      id="keyboard"
      role="group"
      aria-label="On-screen keyboard">
    </div>

    <p class="legend">
      🟩 Green: correct spot<br>
      🟨 Yellow: wrong spot<br>
      ⬜ Gray: letter not in the word
    </p>

    <button id="newGame" type="button">
      ✨ New Game
    </button>
  </main>

  <script>
    "use strict";

    // =====================================================
    // v2.0 - ACCESSIBLE WORD WIZARD
    // =====================================================

    // STEP 1: EDITABLE WORD LIST
    // Add or remove five-letter words here.
    // Every word must contain exactly five letters.
    // The game chooses one randomly on each new game.

    const WORDS = [
      "APPLE", "GRAPE", "PEACH", "LEMON", "MANGO",
      "BERRY", "MELON", "PLANT", "TIGER", "HORSE",
      "SHEEP", "ZEBRA", "PANDA", "BEACH", "OCEAN",
      "RIVER", "CLOUD", "STORM", "RAINY", "SUNNY",
      "HAPPY", "SMILE", "DREAM", "MAGIC", "FAIRY",
      "CANDY", "SUGAR", "HEART", "MUSIC", "DANCE",
      "PARTY", "LIGHT", "GREEN", "WHITE", "BROWN",
      "HOUSE", "CHAIR", "TABLE", "BREAD", "PIZZA"
    ];

    // STEP 2: GAME SETTINGS
    // Each answer has five letters.
    // The player has six chances to guess.

    const WORD_LENGTH = 5;
    const MAX_GUESSES = 6;

    // STEP 3: FIND THE PAGE ELEMENTS
    // These references allow JavaScript to update the
    // board, keyboard, messages, and New Game button.

    const board = document.getElementById("board");
    const keyboard = document.getElementById("keyboard");
    const message = document.getElementById("message");
    const newGameButton = document.getElementById("newGame");

    // STEP 4: REMEMBER THE CURRENT GAME
    // These variables store the answer, guesses,
    // current typed letters, and keyboard colors.

    let secretWord = "";
    let currentGuess = "";
    let submittedGuesses = [];
    let keyboardColors = {};
    let gameOver = false;

    // STEP 5: DEFINE THE KEYBOARD LAYOUT
    // Each string becomes a separate keyboard row.

    const keyboardRows = [
      "QWERTYUIOP",
      "ASDFGHJKL",
      "ZXCVBNM"
    ];

    // STEP 6: SHOW A MESSAGE
    // This updates the screen-reader live region.

    function showMessage(text) {
      message.textContent = text;
    }

    // STEP 7: CREATE THE GUESSING GRID
    // Make thirty tiles, arranged as six rows of five.
    // Every tile includes an accessible description.

    function drawBoard() {
      board.innerHTML = "";

      for (let row = 0; row < MAX_GUESSES; row++) {
        let letters = "";
        let results = null;

        if (row < submittedGuesses.length) {
          letters = submittedGuesses[row].word;
          results = submittedGuesses[row].colors;
        } else if (row === submittedGuesses.length) {
          letters = currentGuess;
        }

        for (let col = 0; col < WORD_LENGTH; col++) {
          const tile = document.createElement("div");
          tile.className = "tile";

          const letter = letters[col] || "";
          tile.textContent = letter;

          let description = "empty";

          if (letter) {
            description = letter;
            tile.classList.add("filled");
          }

          if (results) {
            const color = results[col];
            tile.classList.add(color);

            const meanings = {
              correct: "correct letter and position",
              present: "correct letter, wrong position",
              absent: "letter not in the answer"
            };

            description += ", " + meanings[color];
          }

          tile.setAttribute(
            "role",
            "img"
          );

          tile.setAttribute(
            "aria-label",
            "Guess " + (row + 1) +
            ", position " + (col + 1) +
            ": " + description
          );

          board.appendChild(tile);
        }
      }
    }

    // STEP 8: MAKE A CLICKABLE KEY
    // Each letter, Enter, and Backspace is a real button.
    // Buttons support mouse, touch, and keyboard use.

    function makeKey(letter) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "key";

      if (letter === "ENTER" || letter === "BACKSPACE") {
        button.classList.add("special");
      }

      button.textContent =
        letter === "BACKSPACE" ? "⌫" : letter;

      button.setAttribute(
        "aria-label",
        letter === "BACKSPACE" ? "Backspace" : letter
      );

      if (keyboardColors[letter]) {
        button.classList.add(keyboardColors[letter]);
      }

      button.addEventListener("click", function() {
        handleKey(letter);
      });

      return button;
    }

    // STEP 9: DRAW THE ON-SCREEN KEYBOARD
    // The bottom row includes Enter and Backspace.

    function drawKeyboard() {
      keyboard.innerHTML = "";

      keyboardRows.forEach(function(letters, index) {
        const row = document.createElement("div");
        row.className = "key-row";

        if (index === 2) {
          row.appendChild(makeKey("ENTER"));
        }

        for (const letter of letters) {
          row.appendChild(makeKey(letter));
        }

        if (index === 2) {
          row.appendChild(makeKey("BACKSPACE"));
        }

        keyboard.appendChild(row);
      });
    }

    // STEP 10: CHECK THE COLORS OF A GUESS
    // First mark letters in exactly the correct spots.
    // Then mark matching letters in different spots.
    // This two-pass process handles duplicate letters.

    function checkGuess(guess) {
      const colors = Array(WORD_LENGTH).fill("absent");
      const remaining = secretWord.split("");

      // First pass: find green matches.
      for (let i = 0; i < WORD_LENGTH; i++) {
        if (guess[i] === secretWord[i]) {
          colors[i] = "correct";
          remaining[i] = null;
        }
      }

      // Second pass: find yellow matches.
      for (let i = 0; i < WORD_LENGTH; i++) {
        if (colors[i] === "correct") {
          continue;
        }

        const position = remaining.indexOf(guess[i]);

        if (position !== -1) {
          colors[i] = "present";
          remaining[position] = null;
        }
      }

      return colors;
    }

    // STEP 11: UPDATE KEYBOARD CLUES
    // Keep the strongest color for each letter.
    // Green is strongest, followed by yellow and gray.

    function updateKeyboardColors(guess, colors) {
      const strength = {
        absent: 1,
        present: 2,
        correct: 3
      };

      for (let i = 0; i < WORD_LENGTH; i++) {
        const letter = guess[i];
        const newColor = colors[i];
        const oldColor = keyboardColors[letter];

        if (
          !oldColor ||
          strength[newColor] > strength[oldColor]
        ) {
          keyboardColors[letter] = newColor;
        }
      }
    }

    // STEP 12: SUBMIT A COMPLETED GUESS
    // Check that five letters were entered.
    // Score the guess and decide whether the player
    // has won, lost, or can continue.

    function submitGuess() {
      if (currentGuess.length !== WORD_LENGTH) {
        showMessage("Please enter five letters first.");
        return;
      }

      const guess = currentGuess;
      const colors = checkGuess(guess);

      submittedGuesses.push({
        word: guess,
        colors: colors
      });

      updateKeyboardColors(guess, colors);
      currentGuess = "";

      if (guess === secretWord) {
        gameOver = true;

        showMessage(
          "🎉 You won! The word was " +
          secretWord +
          ". You solved it in " +
          submittedGuesses.length +
          " guesses!"
        );

      } else if (submittedGuesses.length === MAX_GUESSES) {
        gameOver = true;

        showMessage(
          "Game over! The secret word was " +
          secretWord +
          ". Press New Game to try again."
        );

      } else {
        const remaining =
          MAX_GUESSES - submittedGuesses.length;

        showMessage(
          "Keep trying! " + remaining +
          " guesses remaining."
        );
      }

      drawBoard();
      drawKeyboard();
    }

    // STEP 13: HANDLE PLAYER INPUT
    // Letter keys add letters to the active row.
    // Backspace removes the last letter.
    // Enter submits a completed guess.

    function handleKey(key) {
      if (gameOver) {
        return;
      }

      if (key === "BACKSPACE") {
        currentGuess = currentGuess.slice(0, -1);
        drawBoard();
        return;
      }

      if (key === "ENTER") {
        submitGuess();
        return;
      }

      if (
        /^[A-Z]$/.test(key) &&
        currentGuess.length < WORD_LENGTH
      ) {
        currentGuess += key;
        drawBoard();
      }
    }

    // STEP 14: SUPPORT PHYSICAL KEYBOARDS
    // Players can type letters directly.
    // Ignore shortcuts such as Ctrl+C.
    // Do not interfere with focused button activation.

    document.addEventListener("keydown", function(event) {
      if (
        event.ctrlKey ||
        event.altKey ||
        event.metaKey
      ) {
        return;
      }

      const target = event.target;

      if (
        target.isContentEditable ||
        ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName)
      ) {
        return;
      }

      if (
        target.tagName === "BUTTON" &&
        (event.key === "Enter" || event.key === " ")
      ) {
        return;
      }

      const key = event.key.toUpperCase();

      if (
        /^[A-Z]$/.test(key) ||
        key === "ENTER" ||
        key === "BACKSPACE"
      ) {
        event.preventDefault();
        handleKey(key);
      }
    });

    // STEP 15: START A NEW GAME
    // Choose a random word from the editable list.
    // Reset the board, keyboard, and previous guesses.

    function startNewGame() {
      const validWords = WORDS
        .map(function(word) {
          return word.toUpperCase();
        })
        .filter(function(word) {
          return /^[A-Z]{5}$/.test(word);
        });

      if (validWords.length === 0) {
        showMessage(
          "Please add at least one valid five-letter word."
        );
        return;
      }

      const randomIndex = Math.floor(
        Math.random() * validWords.length
      );

      secretWord = validWords[randomIndex];
      currentGuess = "";
      submittedGuesses = [];
      keyboardColors = {};
      gameOver = false;

      drawBoard();
      drawKeyboard();

      showMessage("Your new word is ready. Start guessing!");
    }

    // STEP 16: CONNECT THE NEW GAME BUTTON
    // Clicking it starts another random round.

    newGameButton.addEventListener("click", startNewGame);

    // STEP 17: START AUTOMATICALLY
    // Run this once when the HTML page first loads.

    startNewGame();

  </script>
</body>
</html>
